<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фестиваль - Подсчёт голосов</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
        }
        h1 { text-align: center; color: #333; margin-bottom: 4px; font-size: 24px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
            background: #f0f0f0;
            border-radius: 14px;
            padding: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            background: transparent;
            color: #666;
            transition: 0.3s;
        }
        .tab-btn:active { transform: scale(0.96); }
        .tab-btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .status-bar {
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-weight: 600;
            font-size: 13px;
        }
        .status-bar.online { background: #d4edda; color: #155724; border: 2px solid #28a745; }
        .status-bar.offline { background: #f8d7da; color: #721c24; border: 2px solid #dc3545; }
        .status-bar.connecting { background: #fff3cd; color: #856404; border: 2px solid #ffc107; }
        .status-bar.saving { background: #cce5ff; color: #004085; border: 2px solid #007bff; }
        .token-input {
            background: #f8f9ff;
            padding: 16px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #667eea;
        }
        .token-input label { font-weight: 600; font-size: 14px; color: #333; }
        .token-input input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            margin-top: 8px;
            background: white;
        }
        .token-input input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .token-input .hint {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }
        .token-input .btn {
            margin-top: 10px;
            width: 100%;
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 18px;
        }
        .stat-card {
            background: #f8f9ff;
            padding: 8px 16px;
            border-radius: 12px;
            text-align: center;
            min-width: 80px;
            flex: 1;
        }
        .stat-card .num { font-size: 24px; font-weight: 700; color: #667eea; }
        .stat-card .label { font-size: 12px; color: #666; }
        .input-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #f8f9ff;
            padding: 16px;
            border-radius: 15px;
            margin-bottom: 20px;
            align-items: flex-end;
        }
        .input-group {
            flex: 1 1 140px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 100px;
        }
        .input-group label { font-weight: 600; font-size: 12px; color: #555; }
        .input-group input {
            padding: 12px 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            width: 100%;
            background: white;
        }
        .input-group input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .input-group input[type="number"] { -moz-appearance: textfield; }
        .input-group input[type="number"]::-webkit-outer-spin-button,
        .input-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            color: white;
            background: #667eea;
            flex: 0 0 auto;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.96); }
        .btn-add { background: #28a745; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-success { background: #17a2b8; }
        .btn-primary { background: #667eea; }
        .btn-danger { background: #dc3545; }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 14px 0;
        }
        .actions .btn {
            flex: 1 1 auto;
            min-width: 100px;
            text-align: center;
        }
        .delete-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            padding: 12px;
            background: #fff5f5;
            border-radius: 12px;
            border: 1px solid #fcc;
        }
        .delete-section label {
            font-weight: 600;
            font-size: 13px;
            color: #dc3545;
        }
        .delete-section input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            flex: 1;
            min-width: 120px;
        }
        .delete-section input:focus {
            border-color: #dc3545;
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.2);
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: 15px;
            border: 1px solid #eee;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background: #667eea;
            color: white;
            padding: 10px 6px;
            text-align: center;
        }
        td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid #eee;
            background: white;
        }
        .winner-row td { background: #ffd700 !important; font-weight: 700; border-bottom: 3px solid #ffa500; }
        .total-cell { font-weight: 700; font-size: 16px; color: #333; }
        .empty-message { text-align: center; padding: 25px; color: #888; font-style: italic; }
        .footer {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: #555;
            font-size: 13px;
            align-items: center;
            justify-content: space-between;
        }
        .save-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #e8f5e9;
            color: #28a745;
        }
        .sync-info { font-size: 11px; color: #888; text-align: center; margin-top: 6px; }
        @media (max-width: 600px) {
            .container { padding: 14px; }
            .input-section { flex-direction: column; padding: 12px; }
            .input-group { flex: 1 1 auto; width: 100%; }
            .btn { width: 100%; justify-content: center; }
            .actions .btn { min-width: 80px; }
            .stats .stat-card { flex: 1 1 50px; min-width: 50px; padding: 6px 10px; }
            .stat-card .num { font-size: 18px; }
            h1 { font-size: 20px; }
            .footer { flex-direction: column; align-items: stretch; text-align: center; }
            .token-input input { font-size: 14px; }
            .tabs { flex-wrap: wrap; }
            .tab-btn { font-size: 12px; padding: 8px; }
            .delete-section { flex-direction: column; }
            .delete-section input { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎭 Фестиваль</h1>
    <p class="subtitle">Выберите номинацию и введите оценки</p>

    <div class="tabs" id="tabsContainer">
        <button class="tab-btn active" data-tab="national">🎵 Национальный</button>
        <button class="tab-btn" data-tab="free">🎸 Свободный</button>
        <button class="tab-btn" data-tab="evening">🌙 Вечерний</button>
    </div>

    <div id="statusBar" class="status-bar connecting">⏳ Подключение к GitHub...</div>

    <div class="token-input" id="tokenBlock">
        <label>🔑 Введите GitHub токен</label>
        <input type="password" id="tokenInput" placeholder="Вставьте токен (ghp_...)" autocomplete="off">
        <button class="btn btn-primary" id="tokenBtn">✅ Подключиться</button>
    </div>

    <div id="appContent" style="display: none;">
        <div class="stats">
            <div class="stat-card"><div class="num" id="statParticipants">0</div><div class="label">👤 Участников</div></div>
            <div class="stat-card"><div class="num" id="statVotes">0</div><div class="label">📊 Оценок</div></div>
            <div class="stat-card" style="background:#fff3cd;"><div class="num" id="statAvg">—</div><div class="label">🏆 Средний балл лидера</div></div>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label>👤 Имя участника</label>
                <input type="text" id="nameInput" placeholder="Например: Анна">
            </div>
            <div class="input-group" style="flex:0 0 110px;">
                <label>⭐ Оценка (0–10)</label>
                <input type="number" id="scoreInput" placeholder="10" min="0" max="10" step="0.1">
            </div>
            <div class="input-group" style="flex:0 0 auto;">
                <button class="btn btn-add" id="addBtn">➕ Добавить</button>
            </div>
        </div>

        <div class="delete-section">
            <label>🗑️ Удалить участника:</label>
            <input type="text" id="deleteName" placeholder="Введите имя">
            <button class="btn btn-danger" id="deleteBtn">✕ Удалить</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead><tr><th>Участник</th><th>Средний балл</th><th>Кол-во</th><th>Все оценки</th></tr></thead>
                <tbody id="tableBody"><tr><td colspan="4" class="empty-message">Нет данных</td></tr></tbody>
            </table>
        </div>

        <div class="actions">
            <button class="btn btn-warning" id="calcBtn">🏆 Победитель</button>
            <button class="btn btn-success" id="syncBtn">🔄 Синхронизировать</button>
        </div>

        <div class="footer">
            <span id="winnerDisplay">👑 Победитель: не определен</span>
            <span class="save-status" id="statusDisplay">☁️ Готов</span>
        </div>
        <div class="sync-info">💾 Синхронизация только по кнопке</div>
    </div>
</div>

<script>
    // ============================================================
    // НАСТРОЙКИ
    // ============================================================
    var REPO_OWNER = 'fr4chek';
    var REPO_NAME = 'festival-votes';
    var DATA_FILES = {
        'national': 'data_national.json',
        'free': 'data_free.json',
        'evening': 'data_evening.json'
    };
    // ============================================================

    var currentTab = 'national';
    var allData = { 'national': { votes: [] }, 'free': { votes: [] }, 'evening': { votes: [] } };
    var githubToken = '';
    var winnerName = null;

    // DOM
    var tabsContainer = document.getElementById('tabsContainer');
    var tokenBlock = document.getElementById('tokenBlock');
    var tokenInput = document.getElementById('tokenInput');
    var tokenBtn = document.getElementById('tokenBtn');
    var appContent = document.getElementById('appContent');
    var statusBar = document.getElementById('statusBar');
    var nameInput = document.getElementById('nameInput');
    var scoreInput = document.getElementById('scoreInput');
    var tableBody = document.getElementById('tableBody');
    var winnerDisplay = document.getElementById('winnerDisplay');
    var statusDisplay = document.getElementById('statusDisplay');
    var statParticipants = document.getElementById('statParticipants');
    var statVotes = document.getElementById('statVotes');
    var statAvg = document.getElementById('statAvg');
    var addBtn = document.getElementById('addBtn');
    var calcBtn = document.getElementById('calcBtn');
    var syncBtn = document.getElementById('syncBtn');
    var deleteBtn = document.getElementById('deleteBtn');
    var deleteName = document.getElementById('deleteName');

    // ========== ВКЛАДКИ ==========
    tabsContainer.addEventListener('click', function(e) {
        var btn = e.target.closest('.tab-btn');
        if (!btn) return;
        var tab = btn.dataset.tab;
        if (tab === currentTab) return;
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentTab = tab;
        render();
    });

    // ========== УДАЛЕНИЕ ==========
    deleteBtn.addEventListener('click', function() {
        var name = deleteName.value.trim();
        if (!name) { alert('Введите имя'); return; }
        var votes = allData[currentTab].votes;
        var found = false;
        for (var i = 0; i < votes.length; i++) {
            if (votes[i].name === name) { found = true; break; }
        }
        if (!found) { alert('Участник "' + name + '" не найден'); deleteName.value = ''; return; }
        if (!confirm('Удалить "' + name + '"?')) return;
        var newVotes = [];
        for (var j = 0; j < votes.length; j++) {
            if (votes[j].name !== name) { newVotes.push(votes[j]); }
        }
        allData[currentTab].votes = newVotes;
        if (winnerName === name) winnerName = null;
        render();
        saveToGitHub(currentTab);
        deleteName.value = '';
        setStatus('🗑️ Удалён: ' + name, '#dc3545');
    });

    deleteName.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); deleteBtn.click(); }
    });

    // ========== ОСТАЛЬНОЙ КОД ==========
    function setStatus(text, color) {
        statusDisplay.textContent = text;
        statusDisplay.style.color = color || '#28a745';
    }

    function setStatusBar(status, message) {
        statusBar.className = 'status-bar ' + status;
        statusBar.textContent = message;
    }

    function getUniqueParticipants(votes) {
        var set = new Set();
        for (var i = 0; i < votes.length; i++) { set.add(votes[i].name); }
        return Array.from(set).sort();
    }

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function saveToken(token) { try { localStorage.setItem('github_token', token); } catch(e) {} }
    function loadToken() { try { return localStorage.getItem('github_token') || ''; } catch(e) { return ''; } }

    function utf8ToBase64(str) {
        var encoder = new TextEncoder();
        var bytes = encoder.encode(str);
        var binary = '';
        for (var i = 0; i < bytes.length; i++) { binary += String.fromCharCode(bytes[i]); }
        return btoa(binary);
    }

    function base64ToUtf8(base64) {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
        var decoder = new TextDecoder('utf-8');
        return decoder.decode(bytes);
    }

    function getDataFilePath(tab) { return DATA_FILES[tab] || 'data.json'; }

    async function saveToGitHub(tab) {
        if (!githubToken) return;
        var filePath = getDataFilePath(tab);
        var votes = allData[tab]?.votes || [];
        try {
            setStatusBar('saving', '💾 Сохранение...');
            var url = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + filePath;
            var loadResponse = await fetch(url, { headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' } });
            var remoteSha = null;
            if (loadResponse.ok) { var loadData = await loadResponse.json(); remoteSha = loadData.sha; }
            var data = { votes: votes, updatedAt: new Date().toISOString() };
            var content = utf8ToBase64(JSON.stringify(data, null, 2));
            var body = { message: 'Обновление данных', content: content };
            if (remoteSha) { body.sha = remoteSha; }
            var saveResponse = await fetch(url, { method: 'PUT', headers: { 'Authorization': 'token ' + githubToken, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' }, body: JSON.stringify(body) });
            if (saveResponse.ok) { setStatusBar('online', '☁️ Сохранено'); setStatus('☁️ Сохранено', '#28a745'); }
            else { throw new Error('Ошибка'); }
        } catch(e) { setStatusBar('offline', '⚠️ Ошибка'); setStatus('❌ Ошибка', '#dc3545'); }
    }

    async function loadFromGitHub(tab) {
        if (!githubToken) return;
        var filePath = getDataFilePath(tab);
        try {
            setStatusBar('connecting', '⏳ Загрузка...');
            var url = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + filePath;
            var response = await fetch(url, { headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' } });
            if (response.status === 404) { allData[tab] = { votes: [] }; render(); return; }
            if (!response.ok) { throw new Error('Ошибка загрузки'); }
            var data = await response.json();
            var content = base64ToUtf8(data.content);
            var jsonData = JSON.parse(content);
            if (jsonData && jsonData.votes) { allData[tab] = { votes: jsonData.votes }; render(); setStatusBar('online', '☁️ Загружено'); setStatus('☁️ Загружено', '#17a2b8'); }
        } catch(e) { setStatusBar('offline', '⚠️ Ошибка'); setStatus('❌ Ошибка', '#dc3545'); }
    }

    function render() {
        var votes = allData[currentTab]?.votes || [];
        var participants = getUniqueParticipants(votes);
        statParticipants.textContent = participants.length;
        statVotes.textContent = votes.length;
        if (participants.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" class="empty-message">Нет данных</td></tr>';
            winnerDisplay.textContent = '👑 Победитель: не определен';
            statAvg.textContent = '—';
            return;
        }
        var html = '', averages = [];
        for (var i = 0; i < participants.length; i++) {
            var p = participants[i];
            var pVotes = [];
            for (var j = 0; j < votes.length; j++) { if (votes[j].name === p) { pVotes.push(votes[j]); } }
            var total = 0, scores = [];
            for (var k = 0; k < pVotes.length; k++) { total += pVotes[k].score; scores.push(pVotes[k].score.toFixed(1)); }
            var count = pVotes.length, avg = count > 0 ? total / count : 0;
            averages.push({ name: p, avg: avg, count: count });
            html += '<tr><td><strong>' + escapeHtml(p) + '</strong></td><td class="total-cell">' + (count > 0 ? avg.toFixed(2) : '—') + '</td><td>' + count + '</td><td>' + scores.join(', ') + '</td></tr>';
        }
        tableBody.innerHTML = html;
        if (winnerName) {
            var rows = tableBody.querySelectorAll('tr');
            for (var r = 0; r < rows.length; r++) {
                var firstTd = rows[r].querySelector('td:first-child');
                if (firstTd && firstTd.textContent.trim() === winnerName) { rows[r].classList.add('winner-row'); }
            }
        }
        var sorted = averages.slice().sort(function(a, b) { return b.avg - a.avg; });
        statAvg.textContent = (sorted.length > 0 && sorted[0].count > 0) ? sorted[0].avg.toFixed(2) : '—';
        if (winnerName) {
            var winner = null;
            for (var w = 0; w < averages.length; w++) { if (averages[w].name === winnerName) { winner = averages[w]; break; } }
            if (winner && winner.count > 0) { winnerDisplay.textContent = '👑 Победитель: ' + winnerName + ' (' + winner.avg.toFixed(2) + ')'; }
            else { winnerDisplay.textContent = '👑 Победитель: не определен'; }
        } else { winnerDisplay.textContent = '👑 Победитель: не определен'; }
    }

    function getTabName(tab) {
        var names = { 'national': 'Национальный', 'free': 'Свободный', 'evening': 'Вечерний' };
        return names[tab] || tab;
    }

    async function addVote() {
        var name = nameInput.value.trim();
        var score = parseFloat(scoreInput.value);
        if (!name) { alert('Введите имя'); nameInput.focus(); return; }
        if (isNaN(score) || score < 0 || score > 10) { alert('Оценка от 0 до 10'); scoreInput.focus(); return; }
        var votes = allData[currentTab].votes;
        votes.push({ id: Date.now() + '_' + Math.random().toString(36).substr(2, 6), name: name, score: score });
        nameInput.value = ''; scoreInput.value = ''; nameInput.focus();
        render(); await saveToGitHub(currentTab);
        setStatus('✅ Добавлено! (' + getTabName(currentTab) + ')', '#28a745');
    }

    function calculateWinner() {
        var votes = allData[currentTab]?.votes || [];
        var participants = getUniqueParticipants(votes);
        if (participants.length === 0) { alert('Нет данных'); return; }
        var averages = [];
        for (var i = 0; i < participants.length; i++) {
            var p = participants[i];
            var pVotes = [];
            for (var j = 0; j < votes.length; j++) { if (votes[j].name === p) { pVotes.push(votes[j]); } }
            var total = 0; for (var k = 0; k < pVotes.length; k++) { total += pVotes[k].score; }
            var count = pVotes.length;
            averages.push({ name: p, avg: count > 0 ? total / count : 0, count: count });
        }
        var sorted = averages.slice().sort(function(a, b) { return b.avg - a.avg; });
        var winner = sorted[0];
        var isTie = false, tieNames = [winner.name];
        for (var t = 1; t < sorted.length; t++) {
            if (Math.abs(sorted[t].avg - winner.avg) < 0.001 && sorted[t].count > 0) { isTie = true; tieNames.push(sorted[t].name); } else break;
        }
        if (isTie) { winnerName = null; winnerDisplay.textContent = '🤝 Ничья: ' + tieNames.join(', ') + ' (' + winner.avg.toFixed(2) + ')'; }
        else { winnerName = winner.name; winnerDisplay.textContent = '👑 Победитель: ' + winner.name + ' (' + winner.avg.toFixed(2) + ')'; }
        render();
    }

    async function syncData() {
        if (!githubToken) { alert('Подключитесь к GitHub'); return; }
        setStatus('🔄 Синхронизация...', '#856404');
        await loadFromGitHub(currentTab);
        setStatus('✅ Синхронизация завершена', '#28a745');
    }

    async function connectToGitHub() {
        var token = tokenInput.value.trim();
        if (!token) { alert('Введите токен'); return; }
        if (!token.startsWith('ghp_')) { alert('Токен должен начинаться с "ghp_"'); return; }
        githubToken = token; saveToken(token);
        tokenBlock.style.display = 'none'; appContent.style.display = 'block';
        await loadFromGitHub('national');
        await loadFromGitHub('free');
        await loadFromGitHub('evening');
        render();
    }

    function init() {
        var savedToken = loadToken();
        if (savedToken) { tokenInput.value = savedToken; connectToGitHub(); }
        else { tokenBlock.style.display = 'block'; appContent.style.display = 'none'; }
    }

    tokenBtn.addEventListener('click', connectToGitHub);
    tokenInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); connectToGitHub(); } });
    addBtn.addEventListener('click', addVote);
    calcBtn.addEventListener('click', calculateWinner);
    syncBtn.addEventListener('click', syncData);
    nameInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); scoreInput.focus(); } });
    scoreInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); addVote(); } });
    init();
</script>
</body>
</html>
